<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mochila Unificada - MAC</title>
    <link rel="stylesheet" href="estilo-mochila.css">
    <style>
        .btn-flutuante {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .btn-excluir {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            width: 100%;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-conteudo {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-conteudo input, .modal-conteudo textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: sans-serif;
        }
        .grid-conteudos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card-item {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <h2 style="padding-left: 20px; font-family: sans-serif;">Mochila Digital - Matérias e Atividades</h2>
    
    <div id="container-mochila" class="grid-conteudos"></div>

    <button id="btn-add-mochila" class="btn-flutuante" onclick="mostrarModal()">+</button>

    <div id="modal-mochila" class="modal">
        <div class="modal-conteudo">
            <h3 style="margin-top: 0; font-family: sans-serif;">Publicar conteúdo</h3>

            <input type="text" id="titulo" placeholder="Título do conteúdo">

            <textarea id="descricao" rows="4" placeholder="Escreva as instruções para os alunos..."></textarea>

            <label style="font-family:sans-serif; font-weight:bold;">Adicionar material:</label>

            <select id="tipoMaterial" onchange="alterarTipoMaterial()" style="padding:10px; border:1px solid #ccc; border-radius:4px;">
                <option value="nenhum">Nenhum</option>
                <option value="youtube">▶️ Vídeo do YouTube</option>
                <option value="foto">🖼️ Foto do computador</option>
            </select>

            <div id="campoYoutube" style="display:none;">
                <input type="url" id="youtubeUrl" placeholder="Cole o link do YouTube (ex.: https://youtu.be/...)">
                <small style="font-family:sans-serif; color:#666;">O vídeo ficará disponível para os alunos dentro da mochila.</small>
            </div>

            <div id="campoFoto" style="display:none;">
                <input type="file" id="fotoArquivo" accept="image/*">
                <small style="font-family:sans-serif; color:#666;">Escolha uma foto do computador.</small>
            </div>

            <button onclick="salvarItem()" style="background: #28a745; color: white; padding: 12px; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Publicar Conteúdo</button>
            <button onclick="fecharModal()" style="background: #6c757d; color: white; padding: 8px; border:none; border-radius:4px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script>
        let modoAcesso = 'professor';
        try {
            if (localStorage.getItem('projeto_mac_modo')) {
                modoAcesso = localStorage.getItem('projeto_mac_modo');
            }
        } catch(e) { }

        function inicializarMochila() {
            const btnProfessor = document.getElementById('btn-add-mochila');
            if (btnProfessor) {
                if (modoAcesso === 'professor') {
                    btnProfessor.style.display = 'flex';
                } else {
                    btnProfessor.style.display = 'none';
                }
            }
            exibirItens();
        }

        function mostrarModal() { 
            document.getElementById('modal-mochila').style.display = 'flex'; 
        }
        
        function fecharModal() { 
            document.getElementById('modal-mochila').style.display = 'none'; 
        }

        function alterarTipoMaterial() {
            const tipo = document.getElementById('tipoMaterial').value;
            document.getElementById('campoYoutube').style.display = tipo === 'youtube' ? 'block' : 'none';
            document.getElementById('campoFoto').style.display = tipo === 'foto' ? 'block' : 'none';
        }

        function obterYoutubeId(url) {
            try {
                const link = new URL(url);
                if (link.hostname.includes('youtu.be')) {
                    return link.pathname.substring(1).split('/')[0];
                }
                if (link.hostname.includes('youtube.com')) {
                    if (link.pathname === '/watch') return link.searchParams.get('v');
                    if (link.pathname.startsWith('/shorts/')) return link.pathname.split('/')[2];
                    if (link.pathname.startsWith('/embed/')) return link.pathname.split('/')[2];
                }
            } catch(e) {}
            return null;
        }

        function lerFotoComoBase64(arquivo) {
            return new Promise((resolve, reject) => {
                if (!arquivo) {
                    resolve(null);
                    return;
                }

                if (!arquivo.type.startsWith('image/')) {
                    reject(new Error('Selecione uma imagem válida.'));
                    return;
                }

                const leitor = new FileReader();
                leitor.onload = () => resolve(leitor.result);
                leitor.onerror = () => reject(new Error('Não foi possível ler a foto.'));
                leitor.readAsDataURL(arquivo);
            });
        }

        async function salvarItem() {
            const campoTitulo = document.getElementById('titulo').value.trim();
            const campoDesc = document.getElementById('descricao').value.trim();
            const tipo = document.getElementById('tipoMaterial').value;

            if (!campoTitulo) {
                return alert("Por favor, digite o título do conteúdo!");
            }

            const novoCard = {
                id: 'card-' + Date.now(),
                titulo: campoTitulo,
                descricao: campoDesc,
                tipoMaterial: 'nenhum',
                youtubeId: null,
                foto: null
            };

            try {
                if (tipo === 'youtube') {
                    const url = document.getElementById('youtubeUrl').value.trim();
                    const youtubeId = obterYoutubeId(url);

                    if (!youtubeId) {
                        return alert("Cole um link válido do YouTube.");
                    }

                    novoCard.tipoMaterial = 'youtube';
                    novoCard.youtubeId = youtubeId;
                }

                if (tipo === 'foto') {
                    const arquivo = document.getElementById('fotoArquivo').files[0];

                    if (!arquivo) {
                        return alert("Escolha uma foto do computador.");
                    }

                    novoCard.tipoMaterial = 'foto';
                    novoCard.foto = await lerFotoComoBase64(arquivo);
                }

                let bancoMochila = [];
                try {
                    bancoMochila = JSON.parse(localStorage.getItem('banco_mochila')) || [];
                } catch(e) {}

                bancoMochila.push(novoCard);

                localStorage.setItem('banco_mochila', JSON.stringify(bancoMochila));

                document.getElementById('titulo').value = '';
                document.getElementById('descricao').value = '';
                document.getElementById('youtubeUrl').value = '';
                document.getElementById('fotoArquivo').value = '';
                document.getElementById('tipoMaterial').value = 'nenhum';
                alterarTipoMaterial();

                fecharModal();
                exibirItens();

            } catch(e) {
                alert("Não foi possível publicar esse conteúdo. Se for uma foto muito grande, tente uma imagem menor.");
                console.error(e);
            }
        }

        function excluirItem(idItem) {
            let bancoMochila = [];
            try {
                bancoMochila = JSON.parse(localStorage.getItem('banco_mochila')) || [];
            } catch(e) { }

            bancoMochila = bancoMochila.filter(item => item.id !== idItem);

            try {
                localStorage.setItem('banco_mochila', JSON.stringify(bancoMochila));
            } catch(e) { }

            exibirItens();
        }

        function escaparHtml(texto) {
            return String(texto || '').replace(/[&<>"']/g, function(c) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[c];
            });
        }

        function exibirItens() {
            const container = document.getElementById('container-mochila');
            if (!container) return;
            container.innerHTML = '';

            let bancoMochila = [];
            try {
                bancoMochila = JSON.parse(localStorage.getItem('banco_mochila')) || [];
            } catch(e) {}

            bancoMochila.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card-item';

                const exibirBotaoExcluir = (modoAcesso === 'professor') ? 'block' : 'none';

                let materialHtml = '';

                if (item.tipoMaterial === 'youtube' && item.youtubeId) {
                    materialHtml = `
                        <div class="material-mochila">
                            <p style="font-weight:bold; margin-bottom:8px;">▶️ Vídeo</p>
                            <div style="position:relative; width:100%; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:8px;">
                                <iframe
                                    src="https://www.youtube.com/embed/${encodeURIComponent(item.youtubeId)}"
                                    title="Vídeo do YouTube"
                                    style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    allowfullscreen>
                                </iframe>
                            </div>
                        </div>`;
                }

                if (item.tipoMaterial === 'foto' && item.foto) {
                    materialHtml = `
                        <div class="material-mochila">
                            <p style="font-weight:bold; margin-bottom:8px;">🖼️ Foto</p>
                            <img
                                src="${item.foto}"
                                alt="Foto adicionada pelo professor"
                                style="display:block; width:100%; max-height:420px; object-fit:contain; border-radius:8px; background:#f4f4f4;">
                        </div>`;
                }

                card.innerHTML = `
                    <div>
                        <h3 style="margin-top:0; color:#333; font-family:sans-serif;">${escaparHtml(item.titulo)}</h3>
                        <p style="color:#555; font-family:sans-serif; line-height:1.5; font-size:14px; white-space: pre-wrap;">${escaparHtml(item.descricao)}</p>
                        ${materialHtml}
                    </div>
                    <button class="btn-excluir" style="display: ${exibirBotaoExcluir}" onclick="excluirItem('${item.id}')">Excluir Conteúdo</button>
                `;

                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', inicializarMochila);
        window.onload = inicializarMochila;
    </script>
</body>
</html>
